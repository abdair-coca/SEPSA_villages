name: CI

on:
  push:
  pull_request:

jobs:
  backend-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: phase5
          POSTGRES_USER: phase5
          POSTGRES_PASSWORD: phase5_synthetic_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase5 -d phase5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://phase5:phase5_synthetic_only@127.0.0.1:5432/phase5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run db:migrate:test
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - name: Validate OpenAPI JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('openapi/pilot-provisional.openapi.json','utf8'))"
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: field-app/package-lock.json
      - run: npm ci
        working-directory: field-app
      - name: Connected headless browser journey
        run: npm run e2e:browser
        working-directory: backend

  field-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: field-app/package-lock.json
      - run: npm ci
        working-directory: field-app
      - run: npm test -- --run
        working-directory: field-app
      - run: npm run build
        working-directory: field-app
      - name: Browser smoke for responsive admin and field flow
        run: npm run smoke:ui
        working-directory: field-app
      - name: Browser smoke for offline queue and PWA recovery
        run: npm run smoke:pwa
        working-directory: field-app
