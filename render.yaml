services:
  - type: web
    name: sepsa-pilot-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_TTL_SECONDS
        value: "28800"
      - key: AUTHORIZATION_TTL_SECONDS
        value: "300"
      - key: HTTP_MAX_BODY_BYTES
        value: "1048576"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
